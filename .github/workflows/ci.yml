name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Issues.UI/package-lock.json

      - name: Restore .NET
        run: dotnet restore Wolverine.slnx

      - name: Build .NET
        run: dotnet build Wolverine.slnx --configuration Release --no-restore

      - name: Run generator tests
        run: dotnet test Wolverine.ValueTypes/Tests/NForza.Wolverine.ValueTypes.Tests.csproj --configuration Release --no-build

      - name: Run API integration tests
        run: dotnet test IssuesAPI/IssuesAPI.Tests/Wolverine.Issues.Tests.csproj --configuration Release --no-build
        env:
          ConnectionStrings__Marten: "Host=localhost;Port=5432;Database=issues_test;Username=postgres;Password=postgres"

      - name: Run reporting tests
        run: dotnet test IssuesAPI.Reporting/IssuesAPI.Reporting.Tests/Wolverine.Reporting.Tests.csproj --configuration Release --no-build
        env:
          ConnectionStrings__Marten: "Host=localhost;Port=5432;Database=reporting_test;Username=postgres;Password=postgres"

      - name: Pack NuGet
        run: dotnet pack Wolverine.Generators/NForza.Wolverine.Generators.csproj --configuration Release --no-build --output ./nupkg

      - name: Verify NuGet package
        run: |
          for pkg in ./nupkg/*.nupkg; do
            echo "=== $pkg ==="
            unzip -l "$pkg"
          done

      - name: Install Angular dependencies
        working-directory: Issues.UI
        run: npm ci

      - name: Build Angular app
        working-directory: Issues.UI
        run: npx ng build

      - name: Run Angular tests
        working-directory: Issues.UI
        run: npx ng test --watch=false

      - name: Upload NuGet artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*.nupkg
