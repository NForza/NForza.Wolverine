server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA routing - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Issues API
    location /api/ {
        proxy_pass http://issues-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Proxy SignalR hub
    location /hub/ {
        proxy_pass http://issues-api:8080/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy reporting API requests
    location /reporting/ {
        proxy_pass http://reporting-api:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
