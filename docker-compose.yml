services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: issues
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./IssuesAPI/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  issues-api:
    build:
      context: .
      dockerfile: IssuesAPI/IssuesAPI/Dockerfile
    ports:
      - "5035:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Issues: "Host=postgres;Port=5432;Database=issues;Username=postgres;Password=postgres"
      RabbitMQ__HostName: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reporting-api:
    build:
      context: .
      dockerfile: IssuesAPI.Reporting/IssuesAPI.Reporting/Dockerfile
    ports:
      - "5036:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Reporting: "Host=postgres;Port=5432;Database=reporting;Username=postgres;Password=postgres"
      RabbitMQ__HostName: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ui:
    build:
      context: Issues.UI
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - issues-api
      - reporting-api

volumes:
  pgdata:
  rabbitmqdata:
